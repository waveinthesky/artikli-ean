<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artikli PRO</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg: #eef3fa;
      --card: #ffffff;
      --text: #172033;
      --muted: #6b7a90;
      --line: #dfe7f2;
      --primary: #1849d6;
      --primary-soft: #edf3ff;
      --ok: #067647;
      --danger: #d92d20;
      --radius: 22px;
      --shadow: 0 14px 32px rgba(17,24,39,.08);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #f4f7fb 0%, #eef3fa 100%);
      color: var(--text);
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 12px;
      display: grid;
      gap: 12px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .header {
      display: grid;
      gap: 4px;
      padding-top: 6px;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.05;
    }
    .sub {
      color: var(--muted);
      font-size: 14px;
    }
    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .mini-box {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #f8fbff;
      padding: 12px;
    }
    .mini-box small {
      display: block;
      color: var(--muted);
      margin-bottom: 6px;
      font-size: 12px;
    }
    .mini-box strong {
      font-size: 19px;
    }
    input, button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 15px 16px;
      font-size: 17px;
      background: #fff;
    }
    input:focus {
      outline: 2px solid #cfe0ff;
      border-color: #b8cefb;
    }
    button {
      cursor: pointer;
      font-weight: bold;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .btn-soft {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: #d7e5ff;
    }
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    #reader {
      width: 100%;
      display: none;
      overflow: hidden;
      border-radius: 18px;
      border: 1px dashed #c7d3eb;
    }
    .status {
      display: none;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
    }
    .status.ok {
      display: block;
      background: #ecfdf3;
      border: 1px solid #b7ebc6;
      color: var(--ok);
    }
    .status.err {
      display: block;
      background: #fff3f2;
      border: 1px solid #ffd0cc;
      color: var(--danger);
    }
    details { margin-top: 4px; }
    summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      list-style: none;
      user-select: none;
    }
    summary::-webkit-details-marker { display: none; }
    .upload-box {
      display: grid;
      gap: 10px;
      padding-top: 8px;
    }
    .small {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .fullscreen-product {
      min-height: 46vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-radius: 26px;
      padding: 18px;
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
      border: 1px solid var(--line);
    }
    .empty {
      text-align: center;
      color: var(--muted);
      border: 1px dashed #cad5ea;
      border-radius: 20px;
      padding: 28px 16px;
      background: #fbfcfe;
    }
    .product-name {
      font-size: 31px;
      line-height: 1.08;
      font-weight: bold;
      margin-bottom: 18px;
      word-break: break-word;
    }
    .big-grid {
      display: grid;
      gap: 12px;
    }
    .big-tile {
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      background: #fff;
    }
    .big-tile small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }
    .big-tile strong {
      font-size: 26px;
      line-height: 1.1;
      word-break: break-word;
    }
    .bottom-strip {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .result-count {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 10px;
    }
    .match-list {
      display: grid;
      gap: 8px;
    }
    .mini {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      background: #fff;
    }
    .mini b {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
    }
    @media (min-width: 700px) {
      .big-grid { grid-template-columns: 1fr 1fr; }
    }
  
    .glow {
      animation: glowPulse 1s infinite alternate;
      box-shadow: 0 0 0 0 rgba(24,73,214,.4);
    }
    @keyframes glowPulse {
      from { box-shadow: 0 0 0 0 rgba(24,73,214,.3); }
      to { box-shadow: 0 0 18px 6px rgba(24,73,214,.35); }
    }

  
    .state-ok { color:#067647; font-weight:bold; }
    .state-low { color:#f59e0b; font-weight:bold; }
    .state-zero { color:#d92d20; font-weight:bold; }
    .price-strong { font-weight:900; font-size:28px; }

</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>Pretraga artikala</h1>
      <div class="sub">Brzo, jasno i bez suvišnih koraka.</div>
    </div>

    <div class="card">
      <div class="dashboard">
        <div class="mini-box">
          <small>Ukupno artikala</small>
          <strong id="totalItems">0</strong>
        </div>
        <div class="mini-box">
          <small>Zadnje učitavanje</small>
          <strong id="lastUpdate">-</strong>
        </div>
      </div>
    </div>

    <div class="card" style="display:grid;gap:12px;">
      <input type="text" id="searchInput" placeholder="Ukucaj EAN, naziv ili šifru" autofocus />
      <div class="btn-row">
        <button id="scanBtn" class="btn-primary">Skeniraj barkod</button>
        <button id="stopScanBtn" class="btn-soft">Stop kamera</button>
      </div>
      <div id="reader"></div>
      <div id="statusBox" class="status"></div>

      <details>
        <summary>Upload Excel fajla</summary>
        <div class="upload-box">
          <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" />
          <div class="btn-row">
            <button id="uploadBtn" class="btn-soft">Dodaj Excel u bazu</button>
            <button id="refreshBtn" class="btn-soft">Osvježi podatke</button>
          </div>
          <div class="small">Ova verzija ne briše bazu. Samo dodaje artikle u kolekciju <b>artikli_ean</b>.</div>
        </div>
      </details>
    </div>

    <div class="card">
      <div id="resultInfo" class="result-count">Učitavanje podataka...</div>
      <div id="mainResult" class="fullscreen-product"></div>
    </div>

    <div class="card">
      <div class="small" style="margin-bottom:10px;">Slični rezultati</div>
      <div id="otherResults" class="match-list"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCu-nmYw-mFQAIhhTMMqFBnjtXb_j9rO7o",
      authDomain: "balkan-pos-system.firebaseapp.com",
      projectId: "balkan-pos-system",
      storageBucket: "balkan-pos-system.firebasestorage.app",
      messagingSenderId: "1080780152624",
      appId: "1:1080780152624:web:77fed6a3e9b18ad871b2f5"
    };

    const collectionName = 'artikli_ean';
    let db = null;
    let loadedItems = [];
    let scanner = null;
    let cameraRunning = false;

    const searchInput = document.getElementById('searchInput');
    const fileInput = document.getElementById('fileInput');
    const statusBox = document.getElementById('statusBox');
    const resultInfo = document.getElementById('resultInfo');
    const mainResult = document.getElementById('mainResult');
    const otherResults = document.getElementById('otherResults');
    const readerEl = document.getElementById('reader');
    const totalItemsEl = document.getElementById('totalItems');
    const lastUpdateEl = document.getElementById('lastUpdate');

    function showStatus(message, type = 'ok') {
      statusBox.className = 'status ' + type;
      statusBox.textContent = message;
    }

    
    function getStateStyled(val){
      const num = parseFloat(val);
      if(isNaN(num)) return val;
      if(num <= 0) return '<span class="state-zero">'+num+'</span>';
      if(num <= 5) return '<span class="state-low">'+num+'</span>';
      return '<span class="state-ok">'+num+'</span>';
    }

    function normalizeText(v) {
      return String(v ?? '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .trim();
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function updateDashboard() {
      totalItemsEl.textContent = loadedItems.length;
      const now = new Date();
      lastUpdateEl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function focusAndClear(delay = 700) {
      setTimeout(() => {
        searchInput.value = '';
        searchInput.focus();
      }, delay);
    }

    function mapRow(row) {
      const get = (name) => row[name] ?? '';
      return {
        sifra: get('Šifra'),
        naziv: get('Naziv artikla'),
        jm: get('JM'),
        stanje: get('Stanje'),
        zadnjaNabavnaSPDVom: get('Zadnja nabavna s PDVom'),
        ean: String(get('EAN') ?? '').trim(),
        nazivNorm: normalizeText(get('Naziv artikla')),
        eanNorm: String(get('EAN') ?? '').replace(/\s+/g, ''),
        sifraNorm: normalizeText(get('Šifra'))
      };
    }

    async function connectFirebase() {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.firestore();
        showStatus('Baza je uspješno povezana.');
        await loadItems();
      } catch (e) {
        showStatus('Greška pri povezivanju: ' + e.message, 'err');
      }
    }

    async function parseSelectedFile() {
      const file = fileInput.files[0];
      if (!file) throw new Error('Izaberite Excel fajl.');
      const data = await file.arrayBuffer();
      const workbook = XLSX.read(data, { type: 'array' });
      const sheetName = workbook.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: '' });
      if (!rows.length) throw new Error('Excel fajl nema podataka.');
      const mapped = rows.map(mapRow).filter(x => x.naziv || x.ean || x.sifra);
      if (!mapped.length) throw new Error('Nijedan validan red nije pronađen.');
      return mapped;
    }

    async function uploadItems() {
      try {
        if (!db) throw new Error('Baza nije povezana.');
        const mapped = await parseSelectedFile();
        showStatus('Upload u toku...');
        for (let i = 0; i < mapped.length; i += 300) {
          const batch = db.batch();
          const chunk = mapped.slice(i, i + 300);
          chunk.forEach((item, index) => {
            const safe = String(item.ean || item.sifra || item.naziv || ('row' + index)).replace(/[^a-zA-Z0-9_-]/g, '_');
            const ref = db.collection(collectionName).doc(safe + '_' + Math.random().toString(36).slice(2, 8));
            batch.set(ref, item);
          });
          await batch.commit();
        }
        showStatus('Upload završen. Artikli su dodati u bazu.');
        await loadItems();
      } catch (e) {
        showStatus('Greška pri upload-u: ' + e.message, 'err');
      }
    }

    async function loadItems() {
      try {
        if (!db) throw new Error('Baza nije povezana.');
        const snap = await db.collection(collectionName).get();
        loadedItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        updateDashboard();
        renderSearch(searchInput.value);
      } catch (e) {
        showStatus('Greška pri učitavanju: ' + e.message, 'err');
      }
    }

    function getMatches(query) {
      const q = normalizeText(query);
      const qNoSpace = String(query || '').replace(/\s+/g, '').trim();

      if (!q && !qNoSpace) return [];

      const exactEan = loadedItems.filter(item => (item.eanNorm || '') === qNoSpace && qNoSpace);
      if (exactEan.length) return exactEan;

      return loadedItems.filter(item =>
        (item.nazivNorm || '').includes(q) ||
        (item.eanNorm || '').includes(qNoSpace) ||
        (item.sifraNorm || '').includes(q)
      );
    }

    function renderSearch(query) {
      const matches = getMatches(query);

      if (!query.trim()) {
        resultInfo.textContent = 'Spremno za pretragu ili skeniranje.';
        mainResult.innerHTML = '<div class="empty">Ukucaj naziv, EAN ili skeniraj barkod.</div>';
        otherResults.innerHTML = '';
        return;
      }

      if (!matches.length) {
        resultInfo.textContent = 'Nema pronađenih artikala.';
        mainResult.innerHTML = '<div class="empty">Nema pronađenih artikala.</div>';
        otherResults.innerHTML = '';
        return;
      }

      const first = matches[0];
      resultInfo.textContent = 'Pronađeno: ' + matches.length;

      mainResult.innerHTML = `
        <div class="big-tile" style="margin-bottom:14px;">
          <small>Zadnja nabavna s PDVom</small>
          <strong>${(parseFloat(first.zadnjaNabavnaSPDVom) || 0).toFixed(3)}</strong>
        </div>
        <div class="product-name">${escapeHtml(first.naziv || '-')}</div>
        <div class="big-grid">
          <div class="big-tile">
            <small>Stanje</small>
            <strong>${getStateStyled(first.stanje)}</strong>
          </div>
        </div>
        <div class="bottom-strip">
          <div class="big-tile">
            <small>EAN</small>
            <strong>${escapeHtml(first.ean || '-')}</strong>
          </div>
          <div class="big-tile">
            <small>Šifra</small>
            <strong>${escapeHtml(first.sifra || '-')}</strong>
          </div>
        </div>
      `;

      otherResults.innerHTML = '';
      matches.slice(1, 8).forEach(item => {
        const div = document.createElement('div');
        div.className = 'mini';
        div.innerHTML = `
          <b>${escapeHtml(item.naziv || '-')}</b>
          <div class="small">Cijena: ${(parseFloat(item.zadnjaNabavnaSPDVom)||0).toFixed(3)} | Stanje: ${escapeHtml(item.stanje ?? '-')} | EAN: ${escapeHtml(item.ean || '-')}</div>
        `;
        otherResults.appendChild(div);
      });
    }

    async function startScanner() {
      try {
        if (cameraRunning) return;
        readerEl.style.display = 'block';
        scanner = new Html5Qrcode('reader');
        const cameras = await Html5Qrcode.getCameras();
        if (!cameras || !cameras.length) throw new Error('Kamera nije pronađena.');
        const preferred = cameras.find(c => /back|rear|environment/i.test(c.label)) || cameras[0];
        await scanner.start(
          preferred.id,
          { fps: 10, qrbox: { width: 280, height: 120 } },
          (decodedText) => {
            searchInput.value = decodedText;
            renderSearch(decodedText);
            showStatus('Barkod uspješno skeniran: ' + decodedText);
            try { navigator.vibrate?.(120); } catch {}
            stopScanner();
            focusAndClear();
          },
          () => {}
        );
        cameraRunning = true;
      } catch (e) {
        showStatus('Ne mogu da pokrenem kameru: ' + e.message, 'err');
        readerEl.style.display = 'none';
      }
    }

    async function stopScanner() {
      try {
        if (scanner && cameraRunning) {
          await scanner.stop();
          await scanner.clear();
        }
      } catch {}
      cameraRunning = false;
      readerEl.style.display = 'none';
    }

    document.getElementById('uploadBtn').addEventListener('click', uploadItems);
    document.getElementById('refreshBtn').addEventListener('click', loadItems);
    document.getElementById('scanBtn').addEventListener('click', startScanner);
    document.getElementById('stopScanBtn').addEventListener('click', stopScanner);
    searchInput.addEventListener('input', e => renderSearch(e.target.value));
    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const val = searchInput.value;
        renderSearch(val);
        focusAndClear(500);
      }
    });
    window.addEventListener('beforeunload', stopScanner);

    
    fileInput.addEventListener('change', () => {
      const btn = document.getElementById('uploadBtn');
      if (fileInput.files.length) {
        btn.classList.add('glow');
      } else {
        btn.classList.remove('glow');
      }
    });

    connectFirebase();
  </script>
</body>
</html>
