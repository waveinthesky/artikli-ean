name: Build BottleMeter Pro APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euo pipefail
          cat bottlemeter-build/chunk*.b64 > BottleMeter-Android-project.zip.b64
          base64 --decode BottleMeter-Android-project.zip.b64 > BottleMeter-Android-project.zip
          unzip -q BottleMeter-Android-project.zip
          test -f BottleMeter-Android/settings.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p BottleMeter-Android --no-daemon clean assembleDebug
          mkdir -p output
          cp BottleMeter-Android/app/build/outputs/apk/debug/app-debug.apk output/BottleMeter-Pro-v1.0.apk
          sha256sum output/BottleMeter-Pro-v1.0.apk > output/BottleMeter-Pro-v1.0.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BottleMeter-Pro-APK
          path: output/*
          if-no-files-found: error
          retention-days: 30
